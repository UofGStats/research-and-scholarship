name: Publish Quarto website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      new_count: ${{ steps.changes.outputs.count }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect newly added funding opportunities
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/detect-new-opportunities.mjs

      - name: Save notification data
        if: github.event_name == 'push' && steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: new-funding-opportunities
          path: new-opportunities.json
          retention-days: 1

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render website
        run: quarto render

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Email new funding opportunities
    if: github.event_name == 'push' && needs.build.outputs.new_count != '0'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download notification data
        uses: actions/download-artifact@v5
        with:
          name: new-funding-opportunities

      - name: Send notification email
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          EMAIL_SENDER: daniela.castrocamilo@glasgow.ac.uk
          EMAIL_RECIPIENT: daniela.castrocamilo@glasgow.ac.uk
          FUNDING_FINDER_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/send-funding-notification.mjs
